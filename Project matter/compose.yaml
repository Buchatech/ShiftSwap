# docker-compose.yml (Postgres example)
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_MODE: postgres
      DEMO_MODE: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: shiftswap
      POSTGRES_USER: shiftswap_user
      POSTGRES_PASSWORD: shiftswap_pass
      SESSION_SECRET: change-me
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiftswap
      POSTGRES_USER: shiftswap_user
      POSTGRES_PASSWORD: shiftswap_pass
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: