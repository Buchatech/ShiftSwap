<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftSwap | Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-slate-50" data-page="reports" data-requires-auth="true" data-required-role="manager">
  <div id="demo-mode-banner" class="hidden" role="status" aria-live="polite"></div>
  <header id="global-header"></header>

  <main class="mx-auto max-w-7xl px-4 py-6 md:px-6">
    <section class="mb-6 flex flex-wrap items-end justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Audit Reports</h1>
        <p class="text-sm text-slate-600">Filter and export shift activity history.</p>
      </div>
      <button id="export-csv-btn" class="btn-primary">Export CSV</button>
    </section>

    <section class="card-panel mb-6">
      <h2 class="section-title mb-3">Date range</h2>
      <div class="grid gap-3 md:grid-cols-3">
        <div>
          <label for="report-date-from" class="form-label">From</label>
          <input id="report-date-from" type="date" class="input-field">
        </div>
        <div>
          <label for="report-date-to" class="form-label">To</label>
          <input id="report-date-to" type="date" class="input-field">
        </div>
        <div class="flex items-end">
          <button id="apply-report-filters-btn" class="btn-secondary w-full">Apply Filters</button>
        </div>
      </div>
    </section>

    <section class="card-panel">
      <h2 class="section-title">Audit trail</h2>
      <div class="table-wrapper">
        <table class="table-base">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Actor</th>
              <th>Action</th>
              <th>Shift ID</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="audit-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/shifts.js"></script>
  <script src="../js/claims.js"></script>
  <script src="../js/approvals.js"></script>
</body>
</html>
