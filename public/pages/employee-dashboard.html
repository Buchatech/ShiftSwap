<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftSwap | Employee Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-slate-50" data-page="employee-dashboard" data-requires-auth="true">
  <div id="demo-mode-banner" class="hidden" role="status" aria-live="polite"></div>
  <header id="global-header"></header>

  <main class="mx-auto max-w-7xl px-4 py-6 md:px-6">
    <section class="mb-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Employee Dashboard</h1>
          <p class="text-sm text-slate-600">View open shifts, your posted shifts, and your claims.</p>
        </div>
        <a href="./post-shift.html" class="btn-primary">Post New Shift</a>
      </div>
    </section>

    <section aria-labelledby="open-shifts-heading" class="mb-6">
      <h2 id="open-shifts-heading" class="section-title">Open shifts available to claim</h2>
      <div id="open-shifts-list" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
    </section>

    <section aria-labelledby="posted-shifts-heading" class="mb-6">
      <h2 id="posted-shifts-heading" class="section-title">My posted shifts</h2>
      <div class="table-wrapper">
        <table class="table-base">
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Role</th>
              <th>Location</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="posted-shifts-table"></tbody>
        </table>
      </div>
    </section>

    <section aria-labelledby="claimed-shifts-heading">
      <h2 id="claimed-shifts-heading" class="section-title">My claimed shifts</h2>
      <div class="table-wrapper">
        <table class="table-base">
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Role</th>
              <th>Status</th>
              <th>Approval</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="claimed-shifts-table"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/shifts.js"></script>
  <script src="../js/claims.js"></script>
  <script src="../js/approvals.js"></script>
</body>
</html>
